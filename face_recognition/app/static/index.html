<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Face Stream</title>
  <style>
    body { background: #111; color: #fff; text-align: center; font-family: sans-serif; }
    img { width: 80%; border-radius: 12px; margin-top: 20px; }
    .names { margin-top: 10px; font-size: 1.2em; }
    #btn-cadastrar {
      display: none;
      margin-top: 16px;
      padding: 12px 28px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      text-decoration: none;
    }
    #btn-cadastrar:hover { background: #c0392b; }
  </style>
</head>
<body>
  <h1>🔴 Face Recognition Live Stream</h1>
  <img id="video" />
  <div class="names" id="names"></div>
  <a id="btn-cadastrar">⚠️ Rosto não reconhecido — Cadastrar</a>

  <script>
    const ws = new WebSocket("ws://" + location.host + "/ws");
    const img = document.getElementById("video");
    const namesDiv = document.getElementById("names");
    const btnCadastrar = document.getElementById("btn-cadastrar");

    let ultimoFrame = null;

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      img.src = "data:image/jpeg;base64," + data.frame;
      ultimoFrame = data.frame;
      namesDiv.innerHTML = "Detectados: " + (data.names.join(", ") || "Nenhum");

      const temDesconhecido = data.names.some(n => n === "Desconhecido");
      if (temDesconhecido) {
        btnCadastrar.style.display = "inline-block";
        btnCadastrar.href = "/cadastro?foto=" + encodeURIComponent(ultimoFrame);
      } else {
        btnCadastrar.style.display = "none";
      }
    };
  </script>
</body>
</html>
