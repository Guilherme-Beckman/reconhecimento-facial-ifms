services:
  face-recognition:
    build: ./face_recognition/
    container_name: face_recognition_service
    network_mode: host
    volumes:
      - ./face_recognition/images/:/images
      - ./face_recognition/app/:/app

    environment:
      - PYTHONUNBUFFERED=1

    devices:
      - "/dev/video0:/dev/video0"
    stdin_open: true
    tty: true
